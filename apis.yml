description: WeMash was a Los Angeles-based, cloud-based video mashup platform founded
  in 2014 that partnered with movie studios, news organizations, sports entities,
  and music labels to give creators legal access to premium content for derivative
  works, with monetization shared across rights holders. Backed by a roughly $420K
  seed round whose sole institutional investor was Andreessen Horowitz, the company
  is now defunct - wemash.com no longer resolves and no developer, documentation,
  or API surface remains to be catalogued.
